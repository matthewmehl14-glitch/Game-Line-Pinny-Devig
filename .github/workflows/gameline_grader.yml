name: EV Gameline Grader

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grade-plays:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install requests
        
      - name: Run Gameline Grader
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python gameline_grader.py
        
      - name: Commit and Push Settled Bets
        run: |
          git config --global user.name "EV-Gameline-Bot"
          git config --global user.email "bot@example.com"
          
          if [ -f ev_plays_log.csv ]; then
            git add ev_plays_log.csv
            if ! git diff --quiet --cached; then
              git commit -m "Auto-grade settled Gameline plays"
              git pull origin main --rebase
              git push
            fi
          fi
